services:
  app:
    image: ghcr.io/quantinium3/eris:v-0.1.0
    restart: always
    ports:
      - 3000:3000
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LASTFM_APIKEY=${LASTFM_APIKEY}
      - LASTFM_USERNAME=${LASTFM_USERNAME}
      - LASTFM_URI=${LASTFM_URI}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eris_user -d eris_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
